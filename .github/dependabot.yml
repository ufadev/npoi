version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /solution
      - /build
      - /benchmarks/NPOI.Benchmarks
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nuget-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
